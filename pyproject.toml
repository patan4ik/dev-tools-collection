[project]
name = "dev-tools-collection"
version = "1.7.0"
description = "A collection of standalone developer CLI tools."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
report = ["tiktoken"]
dev = ["pytest", "black", "ruff", "mypy", "bandit"]

[project.scripts]
project-context = "dev_tools.project_context.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
