[project]
name = "dev-tools-collection"
version = "1.7.0"
description = "A collection of standalone developer CLI tools."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
report = ["tiktoken"]
mp3 = ["mutagen>=1.47,<2"]
audio = [
    "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
    "faster-whisper>=1.1,<2",
    "huggingface-hub>=1,<2",
    "mutagen>=1.47,<2",
]
dev = ["pytest>=8", "pytest-cov>=5", "black>=25", "ruff>=0.11", "mypy>=1.15", "bandit>=1.8"]

[project.scripts]
project-context = "dev_tools.project_context.cli:main"
meeting-context = "dev_tools.meeting_context.cli:main"
mp3-manager = "dev_tools.mp3_manager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"dev_tools.mp3_manager" = ["README.md"]
"dev_tools.meeting_context" = ["templates/*.md", "templates/*.txt", "README.md"]

[[tool.mypy.overrides]]
module = ["dev_tools.meeting_context.*"]
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["test_meeting_context_workflow", "test_meeting_context_reliability", "test_meeting_context_integration"]
check_untyped_defs = true
