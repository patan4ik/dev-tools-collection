name: CI - Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[report]"
          pip install black ruff pytest pytest-cov

      - name: Run Black (check only)
        run: black --check .

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run tests with coverage
        run: |
          pytest tests/ -v

  meeting-context-quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development tools (no audio models or drivers)
        run: python -m pip install -e ".[dev]"
      - name: Check types for the integrated module
        run: python -m mypy --python-version 3.13 src/dev_tools/meeting_context
      - name: Check security patterns in the integrated module
        run: python -m bandit -r src/dev_tools/meeting_context
      - name: Run meeting audio unit tests
        run: python -m pytest tests/test_meeting_context_workflow.py tests/test_meeting_context_reliability.py tests/test_meeting_context_integration.py -v
